<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendez-vous</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/fr.global.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <h1 id="mainTitle">Rendez-vous</h1>
    <p id="rangeLabel" class="range"></p>
  </div>
  <div class="tb-right">
    <p class="legend">
      <span class="key free"><i></i>Libre</span>
      <span class="key busy"><i></i>Occupé</span>
      <span class="key wait"><i></i>En attente</span>
    </p>
    <button id="adminToggle" class="admin-btn" type="button" hidden>Organisateur</button>
  </div>
</header>

<section id="statusLine" class="status" hidden></section>

<main id="wrap">
  <div id="calendar"></div>
  <p id="noDays" class="no-days" hidden>Aucune plage proposée pour le moment.</p>
</main>

<form id="bookForm" class="book" hidden>
  <p id="slotLine" class="slot-line"></p>
  <label>Nom <input id="bookName" type="text" required></label>
  <label>Courriel <input id="bookEmail" type="email" required></label>
  <label>Motif <input id="bookSubject" type="text"></label>
  <p id="bookError" class="error" hidden></p>
  <menu>
    <button type="button" id="bookCancel" class="ghost">Annuler</button>
    <button type="submit">Demander ce créneau</button>
  </menu>
</form>

<aside id="adminPanel" class="admin" hidden>
  <header>
    <h2>Candidatures en attente</h2>
    <button type="button" id="adminClose" class="ghost">×</button>
  </header>
  <div id="pendList"></div>
</aside>

<script src="./app.js"></script>
</body>
</html>
