<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendez-vous</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
<header class="topbar">
  <h1 id="mainTitle">Rendez-vous</h1>
  <p id="rangeLabel" class="range"></p>
</header>

<section id="statusLine" class="status" hidden></section>

<main id="days" class="days" aria-label="Jours proposés"></main>

<form id="bookForm" class="book" hidden>
  <p id="slotLine" class="slot-line"></p>
  <label>Nom <input id="bookName" type="text" required></label>
  <label>Courriel <input id="bookEmail" type="email" required></label>
  <label>Motif <input id="bookSubject" type="text"></label>
  <p id="bookError" class="error" hidden></p>
  <menu>
    <button type="button" id="bookCancel" class="ghost">Annuler</button>
    <button type="submit">Demander ce créneau</button>
  </menu>
</form>

<script src="./app.js"></script>
</body>
</html>
